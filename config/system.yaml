# Roadmap-Manager (OTTO) — Workspace-Konfig
# Befüllt vom roadmap-setup-Skill.

version: "1.0"

paths:
  roadmap_root: docs/roadmap

# Prüf-Kommandos aus dem eisernen Arbeitsablauf (CLAUDE.md):
# Syntax-Check, Solver-Test-Suite, PaleTools-Wächter-Test der App.
commands:
  syntax_check: "node --check ea-fc-sbc-optimizer.user.js"
  solver_test: "node solver-test.js"
  guard_test: "node app/guard-test.js"

github:
  host: github.com
  owner: Rasmus33
  default_branch: main
  worker_assignee: auto
  lock_on_terminal: true
  default_reviewers: []
  automerge_for_single_repo: true
  automerge_method: squash
  repos:
    - name: pittools
      path: "."
      gh_repo: Rasmus33/pittools
  project:
    number: 3

score_dimensions:
  - code: RA
    name: "Robust Architecture"
    measurement: manual_rubric
    threshold_factor: 0.7

shared_items:
  min_consumers: 3

iteration:
  sprint_default_duration_days: 14

worker:
  pre_commit_gate: syntax_check
  final_gates: [syntax_check, solver_test, guard_test]
  parallel_subagents: 3
  parallel_tickets: 1
  agent_models:
    escalate_to: opus
  transient_flake_patterns: []

# Release-Phase bewusst nicht konfiguriert: Push auf main IST das Deployment
# (Tampermonkey/App laden das Script direkt von raw.githubusercontent.com).
