    eine Doku-/Kleinkram-Runde'
  - 'Auto-Merge + Nachtrag-Commit erzeugt verwaiste Post-Squash-PRs (2x passiert:
    #20, #36) — Prozess-Kandidat: Review erst nach letztem Commit ODER automerge erst
    beim Merge-Schritt armieren'
