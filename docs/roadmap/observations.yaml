# Worker-Knowledge — committetes Wissens-Substrat (ADR #78, erweitert ADR #77).
#
# EINE committete Datei (NICHT gitignored) für alles, was OTTO während einer
# Iteration an Wissen erzeugt. Überlebt Worktree-/Klon-Wechsel + Multi-User;
# Git-Log ist die Per-Iteration-History (ADR #15) — kein Archiv-Ordner.
#
# Drei Bereiche mit GETRENNTER Reset-Semantik (ADR #78):
#
#   entries       Mid-Loop-Beobachtungen der LAUFENDEN Iteration (`observation
#                 add`): surprises[] + PO-Reasoning. Wird bei `iteration-done`
#                 geleert (vorher vom Audit nach learnings.md destilliert).
#                 Schema je Eintrag:
#                   - at: <ISO-8601-UTC>      # Zeitstempel
#                     issue: <nr|null>        # auslösendes Ticket (optional)
#                     po_class: <A..H|Q|null> # PO-Klasse falls zuordenbar
#                     surprises: [<str>, ...]  # Beobachtungen ohne Action-Bedarf
#                     reasoning: <str>         # Klartext / Wurzelursachen-Hunch
#
#   discoveries   Mid-Loop-Kandidaten der LAUFENDEN Iteration (`observation
#                 discovery-add`): Pattern-/Antipattern-/Shared-Item-Kandidaten
#                 + Cross-Feature-Smells. Vorher in gitignored .state.yaml →
#                 jetzt committet (ADR #78). Reife (≥3 Evidenz ∧ ≥2 Tickets)
#                 wird hieraus rekonstruiert. Wird bei `iteration-done` geleert.
#                 Schema je Kandidat: {slug, evidence: [<file:line>], issues:
#                 [<nr>], class?, note?}.
#
#   seeds_next    VORWÄRTS-Seeds für die NÄCHSTE Iteration (`observation seed`,
#                 vom Audit am Iter-Ende geschrieben). Wird beim Start der
#                 Folge-Iteration von Vision/Gap konsumiert (`observation
#                 consume-seeds`) — NICHT bei iteration-done geleert. Ersetzt
#                 das deprecatete gitignored `iteration-seeds.yaml` (ADR #78).
